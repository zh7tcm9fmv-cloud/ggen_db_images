<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.5 Anniv Calendar — Interactive</title>
<style>
  :root {
    --bg: #070b14;
    --panel: rgba(8, 14, 26, 0.97);
    --cyan: #00d9ff;
    --line: rgba(0, 217, 255, 0.35);
    --text: #e8eef8;
    --muted: #8a9bb4;
    --ease: cubic-bezier(0.2, 0, 0, 1);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(1200px 600px at 50% -10%, #122038 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .wrap {
    height: 100dvh;
    max-width: 100%;
    margin: 0 auto;
    padding: 8px 10px 10px;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    justify-items: center;
    box-sizing: border-box;
    gap: 6px;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 16px;
    margin: 0;
    width: min(100%, 1480px);
  }
  header h1 {
    margin: 0; font-size: clamp(16px, 2vw, 22px); font-weight: 700;
    letter-spacing: 0.02em;
  }
  header p { margin: 0; color: var(--muted); font-size: 12px; flex: 1 1 180px; }
  .langs { display: inline-flex; gap: 6px; }
  .langs button {
    appearance: none; border: 1px solid var(--line); background: rgba(0,217,255,.08);
    color: var(--cyan); font-weight: 700; font-size: 12px; letter-spacing: .06em;
    padding: 8px 12px; min-height: 36px; cursor: pointer;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  .langs button.is-active {
    background: linear-gradient(95deg, rgba(0,217,255,.35), rgba(0,140,255,.22));
    color: #fff; border-color: var(--cyan);
  }
  .stage {
    position: relative;
    /* Fill the middle grid row; keep 16:9 so hotspot % stay aligned */
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 1920 / 1080;
    border: 1px solid rgba(0,217,255,.22);
    background: #000;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
    overflow: hidden;
    line-height: 0;
    align-self: center;
    justify-self: center;
  }
  .stage img.chart {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Precise invisible hit targets — no hover chrome on the chart */
  .hotspot {
    position: absolute;
    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    cursor: pointer;
    z-index: 2;
    -webkit-tap-highlight-color: transparent;
  }
  .hotspot:focus-visible {
    outline: 2px solid rgba(0, 217, 255, 0.55);
    outline-offset: 1px;
  }
  .hotspot.is-open {
    outline: 1px solid rgba(0, 217, 255, 0.35);
    outline-offset: 0;
  }

  .scrim {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(2, 6, 16, 0.62);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s var(--ease);
  }
  .scrim.is-on { opacity: 1; pointer-events: auto; }
  .pop {
    position: fixed;
    z-index: 60;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(1600px, calc(100vw - 12px));
    max-height: 96vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 10px 12px 12px;
    background: var(--panel);
    border: 1px solid rgba(0,217,255,.5);
    box-shadow: 0 24px 64px rgba(0,0,0,.65), 0 0 40px rgba(0,217,255,.14);
    color: var(--text);
    line-height: 1.4;
    opacity: 0; pointer-events: none;
    transition: opacity .25s var(--ease);
    text-align: center;
    box-sizing: border-box;
  }
  .pop.is-on { opacity: 1; pointer-events: auto; }
  .pop[hidden] { display: none !important; }
  .pop-head {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 12px;
    margin-bottom: 6px;
    text-align: center;
    min-height: 32px;
    position: relative;
    flex: 0 0 auto;
  }
  .pop-head.has-banner { justify-content: center; align-items: flex-start; }
  .pop-head .titles { flex: 1 1 auto; min-width: 0; text-align: center; padding: 0 96px; box-sizing: border-box; }
  .pop-head strong {
    display: block;
    font-size: clamp(14px, 1.6vw, 17px);
    color: #9eecff;
    margin: 0 0 4px;
    text-align: center;
  }
  .pop-head .when {
    display: block;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .pop-actions {
    display: inline-flex; gap: 8px; flex: 0 0 auto;
    position: absolute; right: 0; top: 0;
  }
  .pop-close, .pop-back {
    appearance: none; border: 1px solid rgba(0,217,255,.4);
    background: rgba(0,217,255,.1); color: #fff;
    min-height: 36px; flex: 0 0 auto;
    font-size: 14px; line-height: 1; cursor: pointer;
    padding: 0 12px;
  }
  .pop-close { width: 36px; font-size: 20px; padding: 0; }
  .pop-schedule {
    text-align: center;
    margin: 0 0 6px;
    font-size: 13px;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .pop-schedule strong { color: #9eecff; font-weight: 600; }

  .pop .item {
    opacity: 0;
    transform: scale(0.4);
    transition:
      transform 0.5s var(--spring),
      opacity 0.3s ease;
    margin: 0;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.1);
    overflow: hidden;
  }
  .pop.is-on .item { opacity: 1; transform: scale(1); }
  .pop.is-on .item:nth-of-type(1) { transition-delay: 0.02s; }
  .pop.is-on .item:nth-of-type(2) { transition-delay: 0.07s; }
  .pop.is-on .item:nth-of-type(3) { transition-delay: 0.12s; }
  .pop.is-on .item:nth-of-type(4) { transition-delay: 0.16s; }
  .pop.is-on .item:nth-of-type(5) { transition-delay: 0.20s; }
  .pop.is-on .item:nth-of-type(6) { transition-delay: 0.24s; }
  .pop.is-on .item:nth-of-type(n+7) { transition-delay: 0.28s; }

  .pop .title-art {
    margin: 0 auto;
    max-width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .pop .title-art img,
  .pop .gallery img {
    width: auto;
    max-width: 100%;
    height: auto;
    max-height: calc(96vh - 92px);
    display: block;
    margin: 0 auto;
    object-fit: contain;
    background: #000;
    image-rendering: -webkit-optimize-contrast;
  }

  .pop .gallery {
    display: grid;
    gap: 8px;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    align-content: center;
    justify-items: stretch;
  }
  .pop .gallery.gallery--solo {
    grid-template-columns: 1fr;
  }
  .pop .gallery.gallery--duo {
    grid-template-columns: 1fr 1fr;
  }
  .pop .gallery:not(.gallery--solo):not(.gallery--duo) {
    grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
  }
  .pop .gallery .item {
    min-width: 0;
    width: 100%;
    max-width: none;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
  }
  /* Equal frame size for every gallery tile (beside title banner) */
  .pop .gallery .item img {
    width: 100%;
    height: auto;
    max-height: min(36vh, calc((96vh - 110px) / 2));
    object-fit: contain;
    object-position: center;
    aspect-ratio: auto;
  }
  .pop .gallery.gallery--solo .item img {
    max-height: calc(96vh - 92px);
  }
  .pop .gallery.gallery--duo .item img {
    max-height: min(40vh, calc((96vh - 110px) / 2));
  }
  .pop.has-title-and-gallery .title-art img {
    max-height: min(48vh, calc(96vh - 220px));
  }
  .pop.has-title-and-gallery .gallery .item img {
    max-height: min(28vh, 240px);
  }
  .pop .empty {
    color: var(--muted);
    font-size: 13px;
    margin: 8px auto 0;
    text-align: center;
  }

  .hint {
    margin: 0;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }

  .pop-links {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    margin: 8px 0 14px;
  }
  .pop-links a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 40px; padding: 0 16px;
    border: 1px solid rgba(0,217,255,.55);
    background: linear-gradient(95deg, rgba(0,217,255,.28), rgba(0,140,255,.18));
    color: #fff; font-weight: 700; font-size: 13px; text-decoration: none;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .pop-links a:hover { border-color: #00d9ff; }
  .pop-blurb {
    margin: 0 0 12px; color: var(--muted); font-size: 13px; text-align: center;
  }
  .hotspot-badge {
    position: absolute; z-index: 3; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 8px;
    text-align: center;
    box-sizing: border-box;
  }
  .hotspot-badge span {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    max-width: 100%;
    padding: 8px 10px;
    box-sizing: border-box;
    background: #0a101c;
    border: 1px solid rgba(0,217,255,.55);
    color: #9eecff;
    font-size: clamp(11px, 1.15vw, 13px);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.35;
    text-align: center;
  }

  body.pop-open { overflow: hidden; }

  @media (max-width: 900px) {
    .pop .gallery:not(.gallery--solo):not(.gallery--duo) {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .pop .gallery:not(.gallery--solo):not(.gallery--duo) .item img {
      max-height: min(32vh, calc((96vh - 110px) / 2));
    }
  }
  @media (max-width: 560px) {
    .pop { width: calc(100vw - 8px); max-height: 96vh; padding: 8px; }
    .pop .title-art img,
    .pop .gallery.gallery--solo .item img { max-height: calc(96vh - 84px); }
    .pop .gallery.gallery--duo,
    .pop .gallery:not(.gallery--solo) {
      grid-template-columns: 1fr;
    }
    .pop .gallery:not(.gallery--solo) .item img {
      max-height: min(36vh, calc((96vh - 100px) / 2));
    }
    .pop.has-title-and-gallery .gallery .item img {
      max-height: min(24vh, 200px);
    }
  }
</style>
</head>

  const stage = document.getElementById('stage');
  const chart = document.getElementById('chart');
  const pop = document.getElementById('pop');
  const scrim = document.getElementById('scrim');
  const langBtns = document.getElementById('langBtns');
  const pageTitle = document.getElementById('pageTitle');
  const hint = document.getElementById('hint');

  let data = CALENDAR_DATA;
  let lang = 'EN';
  let openId = null;

  function tmap(obj) {
    if (!obj) return '';
    return obj[lang] || obj.EN || Object.values(obj)[0] || '';
  }
  function pickLocale(bag) {
    if (!bag) return null;
    if (bag[lang] != null && bag[lang] !== '') return bag[lang];
    if (lang === 'HK' && bag.TW != null && bag.TW !== '') return bag.TW;
    if (lang === 'TW' && bag.HK != null && bag.HK !== '') return bag.HK;
    if (bag.EN != null && bag.EN !== '') return bag.EN;
    const vals = Object.values(bag);
    return vals.length ? vals[0] : null;
  }
  function imagesFor(ev) {
    const picked = pickLocale(ev.images);
    return Array.isArray(picked) ? picked : [];
  }
  function titleImageFor(ev) {
    const picked = pickLocale(ev.title_image || {});
    return typeof picked === 'string' ? picked : '';
  }
  function pngFallback(src) {
    if (!src || !/\.webp$/i.test(src)) return src;
    return src.replace(/\.webp$/i, '.png');
  }
  function escapeHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function imgTag(src) {
    // Prefer lossless PNG for notice wording; WebP as fallback
    const png = pngFallback(src);
    const webp = /\.png$/i.test(String(src))
      ? String(src).replace(/\.png$/i, '.webp')
      : String(src || '');
    const primary = /\.webp$/i.test(String(src)) ? png : String(src || '');
    const secondary = primary === png ? webp : png;
    return '<img src="' + primary + '" alt="" loading="eager" decoding="async" onerror="this.onerror=null;this.src=\'' + secondary + '\'">';
  }

  function placeHotspots() {
    stage.querySelectorAll('.hotspot, .hotspot-badge').forEach(function (el) { el.remove(); });
    (data.events || []).forEach(function (ev) {
      const hit = ev.hit || {};
      const x0 = Number(hit.left);
      const x1 = Number(hit.right);
      if (!Number.isFinite(x0) || !Number.isFinite(x1) || x1 <= x0) return;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hotspot';
      btn.dataset.id = ev.id;
      btn.setAttribute('aria-label', tmap(ev.titles));
      btn.style.left = x0 + '%';
      btn.style.width = (x1 - x0) + '%';
      btn.style.top = ev.row.top + '%';
      btn.style.height = Math.max(1.0, ev.row.bottom - ev.row.top) + '%';
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (openId === ev.id && !pop.hidden) { hidePop(false); return; }
        showPop(ev);
      });
      stage.appendChild(btn);

      if (ev.badge) {
        const badge = document.createElement('div');
        badge.className = 'hotspot-badge';
        badge.style.left = x0 + '%';
        badge.style.width = (x1 - x0) + '%';
        badge.style.top = ev.row.top + '%';
        badge.style.height = Math.max(1.0, ev.row.bottom - ev.row.top) + '%';
        badge.innerHTML = '<span>' + escapeHtml(tmap(ev.blurb) || tmap(ev.schedule_text) || 'Coming soon') + '</span>';
        stage.appendChild(badge);
      }
    });
  }

  let popHistoryPushed = false;

  function hidePop(fromPopstate) {
    openId = null;
    pop.classList.remove('is-on', 'has-title-and-gallery');
    scrim.classList.remove('is-on');
    document.body.classList.remove('pop-open');
    stage.querySelectorAll('.hotspot.is-open').forEach(function (el) {
      el.classList.remove('is-open');
    });
    if (popHistoryPushed && !fromPopstate) {
      popHistoryPushed = false;
      try { history.back(); } catch (err) {}
    } else {
      popHistoryPushed = false;
    }
    window.setTimeout(function () {
      if (openId) return;
      pop.hidden = true;
      pop.setAttribute('aria-hidden', 'true');
      pop.innerHTML = '';
      scrim.hidden = true;
      scrim.setAttribute('aria-hidden', 'true');
    }, 280);
  }

  function showPop(ev) {
    openId = ev.id;
    stage.querySelectorAll('.hotspot').forEach(function (el) {
      el.classList.toggle('is-open', el.dataset.id === ev.id);
    });
    const emptyPop = !!ev.empty_popup;
    const titleImg = emptyPop ? '' : titleImageFor(ev);
    const rawImgs = emptyPop ? [] : imagesFor(ev).filter(Boolean);
    const imgs = rawImgs.filter(function (src) { return src !== titleImg; });
    const galleryImgs = imgs;
    const label = escapeHtml(tmap(ev.titles));
    const solo = galleryImgs.length <= 1;
    const duo = galleryImgs.length === 2;
    const gallery = galleryImgs.map(function (src) {
      return '<figure class="item">' + imgTag(src) + '</figure>';
    }).join('');
    const actions =
      '<div class="pop-actions">' +
      '<button type="button" class="pop-back" id="popBack">Back</button>' +
      '<button type="button" class="pop-close" id="popClose" aria-label="Close">×</button>' +
      '</div>';
    const blurbTxt = emptyPop ? '' : escapeHtml(tmap(ev.blurb));
    const blurb = blurbTxt ? '<p class="pop-blurb">' + blurbTxt + '</p>' : '';
    const linkList = Array.isArray(ev.links) ? ev.links : [];
    const linksHtml = linkList.length
      ? '<div class="pop-links">' + linkList.map(function (L) {
          const href = escapeHtml(L.href || '#');
          const lab = escapeHtml(tmap(L.label) || href);
          return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + lab + '</a>';
        }).join('') + '</div>'
      : '';

    var head;
    if (titleImg) {
      head = '<div class="pop-head has-banner">' +
        '<div class="titles"><strong>' + label + '</strong></div>' +
        actions + '</div>' +
        blurb +
        '<figure class="item title-art" aria-label="' + label + '">' + imgTag(titleImg) + '</figure>';
    } else {
      head = '<div class="pop-head">' +
        '<div class="titles"><strong>' + label + '</strong></div>' +
        actions + '</div>' + blurb;
    }

    pop.classList.toggle('has-title-and-gallery', !!(titleImg && galleryImgs.length));
    pop.innerHTML = head + linksHtml +
      (gallery
        ? '<div class="gallery' + (solo ? ' gallery--solo' : (duo ? ' gallery--duo' : '')) + '">' + gallery + '</div>'
        : (titleImg || linkList.length || blurbTxt ? '' : '<p class="empty">No related images yet.</p>'));
    pop.hidden = false;
    pop.setAttribute('aria-hidden', 'false');
    scrim.hidden = false;
    scrim.setAttribute('aria-hidden', 'false');
    document.body.classList.add('pop-open');
    void pop.offsetWidth;
    requestAnimationFrame(function () {
      pop.classList.add('is-on');
      scrim.classList.add('is-on');
    });
    const closeBtn = document.getElementById('popClose');
    const backBtn = document.getElementById('popBack');
    if (closeBtn) closeBtn.onclick = function () { hidePop(false); };
    if (backBtn) backBtn.onclick = function () { hidePop(false); };
    function fitPopNoScroll() {
      const budget = Math.floor(window.innerHeight * 0.96) - 8;
      const imgs = pop.querySelectorAll('img');
      if (!imgs.length) return;
      let guard = 0;
      while (pop.scrollHeight > budget && guard < 12) {
        let shrunk = false;
        imgs.forEach(function (img) {
          const h = img.clientHeight || img.naturalHeight || 0;
          if (h > 80) {
            img.style.maxHeight = Math.floor(h * 0.92) + 'px';
            shrunk = true;
          }
        });
        if (!shrunk) break;
        guard += 1;
      }
    }
    const popImgs = pop.querySelectorAll('img');
    let pending = popImgs.length;
    if (!pending) fitPopNoScroll();
    popImgs.forEach(function (img) {
      const done = function () {
        pending -= 1;
        if (pending <= 0) fitPopNoScroll();
      };
      if (img.complete) done();
      else {
        img.addEventListener('load', done, { once: true });
        img.addEventListener('error', done, { once: true });
      }
    });
    if (!popHistoryPushed) {
      try {
        history.pushState({ calPop: ev.id }, '', '#event-' + encodeURIComponent(ev.id));
        popHistoryPushed = true;
      } catch (err) {}
    }
  }

  function setLang(next) {
    lang = next;
    langBtns.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('is-active', b.dataset.lang === lang);
    });
    pageTitle.textContent = tmap(data.title);
    const webp = (data.charts && data.charts[lang]) || data.charts.EN;
    const png = (data.chartsPng && data.chartsPng[lang]) || pngFallback(webp);
    chart.onerror = function () { chart.onerror = null; chart.src = png; };
    chart.src = webp;
    hidePop();
    chart.onload = function () { placeHotspots(); };
    if (chart.complete) placeHotspots();
    hint.textContent = (data.events || []).length +
      ' bars · click / tap the colored tint · Esc / backdrop / × to close';
  }

  scrim.addEventListener('click', function () { hidePop(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && openId) hidePop(false);
  });
  window.addEventListener('popstate', function () {
    if (openId) hidePop(true);
  });

  ['EN', 'TW', 'HK', 'JP'].forEach(function (L) {
    if (!data.charts[L]) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.lang = L;
    b.textContent = L;
    b.addEventListener('click', function () { setLang(L); });
    langBtns.appendChild(b);
  });
  setLang('EN');
})();
</script>
</body>
</html>
